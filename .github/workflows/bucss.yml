name: bucss-speaker-podcast

on:
  schedule:
    - cron: '0 22 * * 1,4'    # 毎週 月・木 22:00 UTC（BUCSS登壇者の論文）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: feed                 # ★全シリーズ共通＝同時実行を直列化
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run BUCSS pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
        run: python run_bucss.py
      - name: Commit new episode
        run: |
          git config user.name  "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add docs/ state/
          git commit -m "bucss episode $(date -u +%Y-%m-%d)" || { echo "no new episode"; exit 0; }
          git pull --rebase --autostash origin main || true
          git push
